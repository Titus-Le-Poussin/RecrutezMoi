<DOCTYPE html>
<html lang="fr">
    <head>

    <!-- Lien vers la feuille de style spécifique à l'espace connexion candidat -->
    <link rel="stylesheet" href="style_espace_connexion_candidat.css">

    <!-- Titre affiché dans l'onglet du navigateur -->
    <title>Espace Candidat - Connexion | Recrutez moi!</title>

    <!-- Encodage pour gérer les caractères spéciaux et accents -->
    <meta charset="UTF-8">

    <!-- Responsive : pour que le site s'adapte à la taille de l'écran (mobile, tablette, etc.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Auteur du site -->
    <meta name="author" content="Timothée ITHIER">

    <!-- Autorise les moteurs de recherche à indexer la page -->
    <meta name="robots" content="index, follow">

    <!-- Description pour Google (sous le lien bleu dans les résultats) -->
    <meta name="description" content="Connectez-vous à votre espace candidat sur Recrutez moi! pour accéder à vos offres, CV et candidatures.">

    <!-- Description pour l'aperçu sur les réseaux sociaux (Open Graph) -->
    <meta property="og:description" content="Accédez à votre espace candidat sur Recrutez moi! et gérez vos candidatures en toute simplicité.">

    <!-- Titre pour l'aperçu sur les réseaux sociaux -->
    <meta property="og:title" content="Connexion Espace Candidat | Recrutez moi!">

    <!-- Image pour l'aperçu sur les réseaux sociaux (remplace par une URL valide si besoin) -->
    <meta property="og:image" content="https://imgur.com/a/ObZ96ZF">

    <!-- URL de la page pour l'aperçu sur les réseaux sociaux -->
    <meta property="og:url" content="https://recrutezmoi.com/espace_connexion_candidat">

    <!-- Type de contenu pour Open Graph (site web) -->
    <meta property="og:type" content="website">
    </head>


    <body>
        <div class="header">
            <div class="favicon">
                <img src="Favicon@4x.png" alt="Favicon" class="favicon_image">
            </div>
        </div>
        <div class="LoginBloc">
            <div class = "content_LoginBloc">
                <div class = "titre_LoginBloc">
                    <h1>Content de te revoir!</h1>
                </div>
                <div class = "Connexion_buttons">
                    <button class="button_connexion active">Se connecter</button>
                    <button class="button_inscription">S'inscrire</button>
                </div>
                <div class="Network_connexion">
                    <div class="logos">
                        <img src="Linkedin@4x.png" class="Linkedin_icon">
                        <img src="Google@4x.png" class="google_icon">
                    </div>
                    <div class="or">ou</div>
                </div>
                <div>
                    <form class = "formulaire_connexion">
                        <label for="email">Adresse mail:</label>
                        <input type="email" id="email" name="email" required>
                        <label for="password">Mot de passe:</label>
                        <input type="password" id="password" name="password" required>
                        <button type = "forgot_password" class="button_forgot_password">mot de passe oublié?</button>
                        <div class = "checkbox">
                            <input type="checkbox" id="remember_me" name="remember_me">
                            <label for="remember_me">Rester connecté</label>
                        </div>
                        <button type="submit" class="button_submit">Se connecter</button>
                    </form>
                    <form class="formulaire_inscription" style="display: none;">
    <div class="inscription_columns">
        <div class="col_gauche">
            <label for="email">Adresse mail:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Mot de passe:</label>
            <input type="password" id="password" name="password" required>
            <label for="confirm_password">Confirmer le mot de passe:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <div class="col_droite">
            <label for="last_name">Nom:</label>
            <input type="text" id="last_name" name="last_name" required>
            <label for="first_name">Prénom:</label>
            <input type="text" id="first_name" name="first_name" required>
            <label for="phone">Numéro de téléphone:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
    </div>
    <div class="cv_center">
        <label for="cv">CV (optionnel):</label>
        <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">
    </div>
    <div class="checkbox">
        <input type="checkbox" id="remember_me" name="remember_me">
        <label for="remember_me">Rester connecté</label>
    </div>
    <button type="submit" class="button_s-inscrire">S'inscrire</button>
                    </form>
                </div>
            </div>
        </div>
<script> // Script pour gérer l'affichage des formulaires de connexion et d'inscription
const btnConnexion = document.querySelector('.button_connexion');
const btnInscription = document.querySelector('.button_inscription');
const formConnexion = document.querySelector('.formulaire_connexion');
const formInscription = document.querySelector('.formulaire_inscription');

btnConnexion.addEventListener('click', () => {
    btnConnexion.classList.add('active');
    btnInscription.classList.remove('active');
    formConnexion.style.display = 'flex';
    formInscription.style.display = 'none';
});

btnInscription.addEventListener('click', () => {
    btnInscription.classList.add('active');
    btnConnexion.classList.remove('active');
    formConnexion.style.display = 'none';
    formInscription.style.display = 'flex';
});
</script>

<script> // Script pour gérer l'activation des boutons de connexion et d'inscription
document.querySelectorAll('.Connexion_buttons button').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.Connexion_buttons button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
    });
});
</script>
    </body>

</DOCTYPE>

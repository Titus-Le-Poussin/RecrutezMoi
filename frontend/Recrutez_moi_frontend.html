<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styleFindMe.css">
        <title>Recrutez moi! Offres, CV, candidats et entreprises</title>

        <!--encodage pour gérer les accents -->
        <meta charset = "UTF-8"> 

        <!--pour que le site s'adapte à l'écran (mobile...) -->
        <meta name ="viewport" content="width=device-width, initial-scale=1.0">

        <!--le nom de l'auteur -->
        <meta name="author" content="Timothée ITHIER">

        <!--Autorise google et les autres moteurs à indexer (visiter, analyser, enregistrer et afficher) le site-->
        <meta name="robots" content="index, follow">

        <!-- Description visible dans Google (sous le lien bleu) -->
        <meta name="description" content="Recrutez moi! est une plateforme de recrutement qui met en relation les candidats et les entreprises.">






        <!-- Résumé affiché dans l'aperçu (petit texte gris) -->
        <meta name="og:description" content="Recrutez moi! est une plateforme de recrutement qui met en relation les candidats et les entreprises.">


        <!-- Titre affiché dans l'aperçu (gros texte bleu sur LinkedIn) -->
        <meta property="og:title" content="Recrutez moi! Offres, CV, candidats et entreprises">

        <!-- Image affiché dans l'aperçu (doit être un lien en ligne!) -->
        <meta property="og:image" content="https://imgur.com/a/ObZ96ZF">

        <!-- Lien vers ton site (le lien cliquable dans l’aperçu) -->
        <meta property="og:url" content="https://recrutezmoi.com">

        <!-- Type de contenu (site web normal, pas article ni vidéo) -->
        <meta property="og:type" content="website">

    </head>
    <body>
        <div class = "header"> <!-- En-tête de la page -->
            <div class = "favicon">
                <img src="Favicon@4x.png" alt="Favicon" class="favicon_image">
            </div>
            <div class = "espace_boutons"> <!-- Espace pour les boutons -->
                <button class="espace_candidat_bouton">
                    <span class="texte_candidat">Espace Candidat</span>
                    <img src="candidatLogo@4x.png" alt="Candidat Logo" class="candidat_logo">
                </button>
                
                <button class="espace_entreprise_bouton">
                    <span class="texte_entreprise">Espace Entreprise</span>
                    <img src="entrepriseLogo@4x.png" alt="Candidat Logo" class="candidat_logo">
                </button>
            </div><!-- Espace pour les boutons --> 
        </div><!-- En-tête de la page -->


        <div> <!-- Banderole principale -->
            <div class="banderole_main">
                <div class="banderole_left">
                    <img src="logoV6@4x.png" alt="Logo" class="logo_banderole">
                </div>
                    
                <div class="banderole_right">
                    <span class="allez_on_boss">Aller,<br><span style="white-space:nowrap;">ON BOSS!!</span></span>
                </div>
            </div>
        </div><!-- Banderole principale -->

        <div class = "barre_recherche_main">
            <div class = "barre_left">
                <img src="research.png" alt="Logo" class="logo_recherche">
                <span class = "Recherche">Recherche, mot clés</span>
            </div>
            <div class = "barre_right">
                <img src="point@4x.png" alt="Logo" class="logo_Map">
                <span class = "Recherche">Ville, Département</span>
            </div>
        </div>

        <div class = "espace_carte_et_recherche">
            <div class = "carte">
                <img src="FranceV2.png" alt="Carte" class="carte_image">
            </div>
            <div class = "barre_de_recherche_emplacement">
                <span class = "emplacement_txt">Emplacement</span>
                <button class = "recherche-btn">
                    <img src="fleche2.png" alt="Carte" class="recherche-icon">
                </button>

                <ul class= "recherche-list">
                    <li class="recherche-item">Option 1</li>
                    <li class="recherche-item">Option 2</li>
                    <li class="recherche-item">Option 3</li>
                </ul>
            </div>
        </div>
    <script>
document.querySelectorAll('.recherche-btn').forEach(btn => {
    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const list = this.parentElement.querySelector('.recherche-list');
        if (list) {
            list.style.display = (list.style.display === 'block') ? 'none' : 'block';
        }
    });
});
document.addEventListener('click', function() {
    document.querySelectorAll('.recherche-list').forEach(list => {
        list.style.display = 'none';
    });
});
</script>
    </body>
</html>
